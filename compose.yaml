# Builds the image from the Dockerfile and serves XenLab on http://localhost:8080.
#   XENLAB_PORT        host port (default 8080)
#   XENLAB_SITE_URL    public address, for sharing previews (default: none)
#   XENLAB_SOURCE_URL  source code link (default: the one in .env)
#   XENLAB_GA_ID       Google Analytics 4 measurement ID, asked for consent first (default: none, off)
# Example: XENLAB_SITE_URL=https://xenlab.example.com docker compose up -d --build
services:
  xenlab:
    build:
      context: .
      args:
        VITE_SITE_URL: ${XENLAB_SITE_URL:-}
        VITE_SOURCE_URL: ${XENLAB_SOURCE_URL:-}
        VITE_GA_ID: ${XENLAB_GA_ID:-}
    image: xenlab:latest
    container_name: xenlab
    ports:
      - "${XENLAB_PORT:-8080}:8080"
    restart: unless-stopped
    # nginx-unprivileged only writes to /tmp (pid and temp files), so the rest can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
