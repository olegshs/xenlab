# Serves the built XenLab single-page app (copied to /etc/nginx/conf.d/default.conf).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed files into /assets: they never change, so cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # nginx's mime.types has no entry for .webmanifest and would send application/octet-stream.
    # The empty types block applies to this location only, so default_type sets the type here.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The app shell (index.html at /) and the files from public/; index.html must be revalidated so
    # new builds are picked up. The app has no client-side routes, so any other path is a real 404:
    # serving the page there would give search engines endless duplicates of it (soft 404s).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
