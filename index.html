<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XenLab – Microtonal sandbox</title>
    <!-- Description, Open Graph and Twitter tags are added at build time from vite.config.ts (shareMeta). -->
    <meta name="application-name" content="XenLab" />
    <meta name="apple-mobile-web-app-title" content="XenLab" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply theme and text direction before the first render to avoid a flash.
      // Must stay in sync with src/theme/useTheme.ts and src/i18n/index.ts.
      (function () {
        var root = document.documentElement;
        var mode = 'auto';
        var lang = '';
        try {
          mode = localStorage.getItem('theme-mode') || 'auto';
          lang = localStorage.getItem('lang') || '';
        } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        if (!lang) lang = (navigator.language || 'en').toLowerCase().split('-')[0];
        if (lang === 'iw') lang = 'he';
        if (lang === 'he' || lang === 'ar') root.dir = 'rtl';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
